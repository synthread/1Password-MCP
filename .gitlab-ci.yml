include:
  - project: synthread/infra/ci
    ref: main
    file: /templates/op.yml
    inputs:
      secrets:
        - env: NPM_TOKEN
          item: npm-registry-token
          field: credential

image: node:24@sha256:d5adb040f90e206d1dc91453d08a4fa4165ec0faebd62a3421e6181a14e7f41f

stages:
  - lint
  - build
  - publish

variables:
  HOME: "/tmp"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint
    - npm audit --audit-level=high

build:
  stage: build
  script:
    - npm run build
    - npm test

secrets:
  rules:
    - if: "$CI_COMMIT_TAG"

publish:
  stage: publish
  image: node:24@sha256:d5adb040f90e206d1dc91453d08a4fa4165ec0faebd62a3421e6181a14e7f41f
  needs:
    - secrets
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - NPM_PACKAGE_SCOPE="@${NPM_ORGANIZATION}"
    - NPM_PACKAGE_NAME="${NPM_PACKAGE_SCOPE}/1password-mcp"
    - test -n "$NPM_ORGANIZATION"
    - npm pkg set name="$NPM_PACKAGE_NAME"
    - printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > .npmrc
    - npm publish --access public
